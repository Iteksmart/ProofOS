name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify fresh database migration and model parity
        env:
          DATABASE_URL: sqlite:///./migration-ci.db
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: Run tests
        run: python -m pytest -q --cov=app --cov-report=term --cov-fail-under=70

  proof:
    name: Proof service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/proof
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  mcp-connectors:
    name: Vendor connector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install connector dependencies
        run: pip install -r packages/mcp/requirements.txt pytest
      - name: Test vendor adapters
        run: python -m pytest packages/mcp/tests -q

  agent:
    name: Endpoint agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install agent dependencies
        run: pip install -r apps/agent/requirements.txt pytest
      - name: Test the agent
        run: python -m pytest apps/agent/tests -q
      - name: Published build matches source
        run: python apps/agent/build.py --check

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install workspace dependencies
        run: npm install
      - name: Build web app
        run: npm run build --workspace @proofos/web
      - name: Test web components
        run: npm test --workspace @proofos/web

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit Python runtime dependencies
        run: |
          pip install pip-audit
          pip-audit -r services/api/requirements.txt
          pip-audit -r services/proof/requirements.txt
          pip-audit -r packages/mcp/requirements.txt
      - name: Audit npm production dependencies
        run: |
          npm install
          npm audit --omit=dev
      - name: Audit agent dependencies
        run: pip-audit -r apps/agent/requirements.txt

  security-scan:
    name: Secrets, misconfiguration and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan the full history, not only the latest commit
      - name: Secret scan (gitleaks, full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo --config /repo/.gitleaks.toml --redact --verbose
      - name: Vulnerability and misconfiguration scan (Dockerfiles, compose, dependencies)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-dirs: node_modules,apps/web/node_modules,apps/web/dist
          exit-code: "1"
      - name: Software bill of materials (CycloneDX)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: proofos-sbom.cdx.json
          skip-dirs: node_modules,apps/web/node_modules,apps/web/dist
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: proofos-sbom.cdx.json

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate development and production compose files
        env:
          JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
          JWT_ALGO: HS256
          POSTGRES_USER: proofos
          POSTGRES_PASSWORD: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          POSTGRES_DB: proofos
          PROOF_SIGNING_SEED_HEX: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          AGENT_TOKEN: ci-only-agent-token-with-at-least-32-characters
          CORS_ORIGINS: https://proofos.example.com
          WEB_URL: https://proofos.example.com
          MESHCENTRAL_IMAGE: meshcentral/meshcentral:ci-config-only
        run: |
          cp .env.example .env
          docker compose -f infra/docker-compose.yml config --quiet
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.production.yml config --quiet

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install API deps
        run: pip install -r services/api/requirements.txt
      - name: Install web deps
        run: npm install
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e --workspace @proofos/web
