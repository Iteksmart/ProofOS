name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify fresh database migration and model parity
        env:
          DATABASE_URL: sqlite:///./migration-ci.db
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: Run tests
        run: python -m pytest -q --cov=app --cov-report=term --cov-fail-under=70

  proof:
    name: Proof service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/proof
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  mcp-connectors:
    name: Vendor connector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install connector dependencies
        run: pip install -r packages/mcp/requirements.txt pytest
      - name: Test vendor adapters
        run: python -m pytest packages/mcp/tests -q

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install workspace dependencies
        run: npm install
      - name: Build web app
        run: npm run build --workspace @proofos/web
      - name: Test web components
        run: npm test --workspace @proofos/web

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate development and production compose files
        env:
          JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
          JWT_ALGO: HS256
          POSTGRES_USER: proofos
          POSTGRES_PASSWORD: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          POSTGRES_DB: proofos
          PROOF_SIGNING_SEED_HEX: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          AGENT_TOKEN: ci-only-agent-token-with-at-least-32-characters
          CORS_ORIGINS: https://proofos.example.com
          WEB_URL: https://proofos.example.com
          MESHCENTRAL_IMAGE: meshcentral/meshcentral:ci-config-only
        run: |
          cp .env.example .env
          docker compose -f infra/docker-compose.yml config --quiet
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.production.yml config --quiet

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install API deps
        run: pip install -r services/api/requirements.txt
      - name: Install web deps
        run: npm install
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e --workspace @proofos/web
